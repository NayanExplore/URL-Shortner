version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./url-shortener-sb
      dockerfile: Dockerfile
    container_name: url-shortener-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-db:5432/url_shortener
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: secure_db_password
      DATABASE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: 9a4f2c5e81d7f0a3c6b2e5d8f1a4c7b0e3d6f9a2c5b8e1d4f7a0c3b6e9d2f5a8
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres-db

  frontend:
    build:
      context: ./url-shortener-react
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
