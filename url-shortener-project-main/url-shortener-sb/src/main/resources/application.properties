spring.application.name=url-shortener-sb

# Dynamic server port for Render/container deployment
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:url_shortener;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
# Commented out to allow Hibernate to automatically detect the database dialect (e.g. H2 or PostgreSQL)
#spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}


jwt.secret=${JWT_SECRET:9a4f2c5e81d7f0a3c6b2e5d8f1a4c7b0e3d6f9a2c5b8e1d4f7a0c3b6e9d2f5a8}
jwt.expiration=172800000


# Logging levels: default to INFO for production, override via env vars for debugging
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.url.shortener=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}

frontend.url=${FRONTEND_URL:http://localhost:5173}

